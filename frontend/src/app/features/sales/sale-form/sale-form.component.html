<div class="card" style="max-width: 600px;">
  <div class="card-header">
    <h3 class="card-title">Saisie des Ventes</h3>
  </div>

  <form (ngSubmit)="submit()">
    <div class="form-group">
      <label>Station</label>
      <select class="form-control" [(ngModel)]="sale.stationId" name="stationId" (change)="onStationChange()" required>
        <option [ngValue]="0">Sélectionner une station</option>
        @for (s of stations; track s.id) {
          <option [ngValue]="s.id">{{ s.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Type de Carburant</label>
      <select class="form-control" [(ngModel)]="sale.fuelTypeId" name="fuelTypeId" required>
        <option [ngValue]="0">Sélectionner un carburant</option>
        @for (fuel of fuelTypes; track fuel.id) {
          <option [ngValue]="fuel.id">{{ fuel.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Date de Vente</label>
      <input type="date" class="form-control" [(ngModel)]="sale.saleDate" name="saleDate" [max]="today" required />
    </div>

    <div class="form-group">
      <label>Quantité (Litres)</label>
      <input type="number" class="form-control" [(ngModel)]="sale.quantity" name="quantity" min="0" step="0.01" placeholder="Ex: 850.50" required />
    </div>

    @if (errorMessage) {
      <div class="error-msg">{{ errorMessage }}</div>
    }
    @if (successMessage) {
      <div class="success-msg">{{ successMessage }}</div>
    }

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="submitting">
        {{ submitting ? 'Enregistrement...' : 'Enregistrer la vente' }}
      </button>
      <button type="button" class="btn btn-outline" (click)="goBack()">Retour</button>
    </div>
  </form>
</div>
