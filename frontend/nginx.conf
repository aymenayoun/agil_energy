server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Angular SPA routing ----
    # All non-file routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Proxy API calls to Spring Boot backend ----
    location /api/ {
        proxy_pass http://backend:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ---- Proxy prediction endpoints (long-running ML jobs) ----
    # Batch training across all stations takes several minutes; the default
    # 90s below would return 504 while the job is still running server-side.
    # Longest-prefix match means this wins over the generic /api/ block.
    location /api/predictions/ {
        proxy_pass http://backend:8082/api/predictions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 60s;
    }

    # ---- Proxy AI endpoints (LLM calls on CPU are slow) ----
    location /api/ai/ {
        proxy_pass http://backend:8082/api/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- Proxy Swagger UI ----
    location /swagger-ui/ {
        proxy_pass http://backend:8082/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8082/v3/api-docs;
        proxy_set_header Host $host;
    }

    # ---- Proxy WebSocket (STOMP over SockJS) ----
    location /ws/ {
        proxy_pass http://backend:8082/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ---- Proxy Actuator (health checks) ----
    location /actuator/ {
        proxy_pass http://backend:8082/actuator/;
        proxy_set_header Host $host;
    }
}
