name: CI — AGIL Energy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Backend: Build, Test, Coverage
  # ─────────────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test and generate coverage
        working-directory: backend
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false
          verbose: true

      - name: Post coverage summary (PRs only)
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '📊 Code Coverage Report'
          update-comment: true

  # ─────────────────────────────────────────────
  # Job 2 — Frontend: Install, Test & Build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests (ChromeHeadless)
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress

      - name: Build (production)
        working-directory: frontend
        run: npm run build -- --configuration=production

  # ─────────────────────────────────────────────
  # Job 3 — Build & Publish Docker Images to GHCR
  # ─────────────────────────────────────────────
  docker-publish:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only push images on main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: energy-backend
          - name: frontend
            context: ./frontend
            image: energy-frontend
          - name: ia
            context: ./agil-energy-ia
            image: energy-ia

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ─────────────────────────────────────────────
  # Job 4 — End-to-End Tests (Playwright)
  # ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only on pushes to main (skip PRs for cost; can re-enable later)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Don't fail the whole pipeline yet — flaky on first runs.
    # Remove this once stable.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # Values here are throwaway CI-only credentials, not real secrets.
      - name: Create .env for Docker Compose
        run: |
          cat > .env <<EOF
          DB_PASSWORD=ci_test_password
          DB_NAME=agil_energy
          JWT_SECRET=dGVzdC1vbmx5LXNlY3JldC1mb3ItY2ktcnVucy1ub3QtYS1yZWFsLWtleQ==
          JWT_EXPIRATION=86400000
          JWT_REFRESH_EXPIRATION=604800000
          IA_API_KEY=ci-test-key
          MAIL_HOST=smtp.example.com
          MAIL_PORT=587
          MAIL_USERNAME=
          MAIL_PASSWORD=
          MAIL_FROM=test@example.com
          MAIL_FROM_NAME=AGIL Test
          MANAGEMENT_HEALTH_MAIL_ENABLED=false
          OTP_ENABLED=false
          ALERT_EMAIL_ENABLED=false
          EOF

      - name: Start Docker stack (backend + frontend + mysql)
        run: |
          docker compose up -d --build mysql backend frontend
        env:
          MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
          OTP_ENABLED: "false"
          ALERT_EMAIL_ENABLED: "false"

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend on http://localhost:8082..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/actuator/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ] && [ "$HTTP_CODE" != "" ]; then
              echo "Backend is up (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  attempt $i/60 — backend not ready yet (HTTP $HTTP_CODE), sleeping 5s"
            sleep 5
          done
          echo "::error::Backend did not start in time"
          docker compose logs backend
          exit 1

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

      - name: Dump container logs (on failure)
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose logs backend
          echo "=== Frontend logs ==="
          docker compose logs frontend
          echo "=== MySQL logs ==="
          docker compose logs mysql

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v
