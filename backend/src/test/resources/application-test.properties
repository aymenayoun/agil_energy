# ============================================
# Test profile — H2 in-memory database
# Used by @SpringBootTest in CI (no MySQL needed)
# ============================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable mail
spring.mail.host=localhost
spring.mail.port=9999
spring.mail.username=test
spring.mail.password=test

# JWT (dummy values for tests)
jwt.secret=Y2ktdGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS0yMDI1
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# IA (dummy — tests mock this service)
ia.service.url=http://localhost:5000
ia.service.api-key=test-key

# OTP
app.otp.enabled=false
app.otp.expiration-minutes=5
app.otp.required-roles=ADMIN

# Alert
app.alert.email.enabled=false

# Mail sender identity (required by EmailServiceImpl @Value injection)
app.mail.from=test@agil-energy.com
app.mail.from-name=AGIL Energy Test