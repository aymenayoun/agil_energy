spring.application.name=energy
spring.autoconfigure.exclude=de.codecentric.boot.admin.server.config.AdminServerNotifierAutoConfiguration
# ========================
# SERVER
# ========================
server.port=8082

# ========================
# DATABASE (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ========================
# JACKSON (JSON)
# ========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Africa/Tunis

# ========================
# JWT Configuration
# ========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ========================
# IA Microservice
# ========================
ia.service.url=${IA_SERVICE_URL}
ia.service.api-key=${IA_API_KEY}

# ========================
# ACTUATOR (Monitoring)
# ========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:true}

# ========================
# LOGGING
# ========================
logging.level.com.agil.energy=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========================
# MAIL (SMTP)
# ========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}

# ========================
# 2FA OTP
# ========================
app.otp.enabled=${OTP_ENABLED:true}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
app.otp.required-roles=${OTP_REQUIRED_ROLES:ADMIN}

# ========================
# Password Reset
# ========================
app.reset.expiration-minutes=${RESET_EXPIRATION_MINUTES:30}
app.reset.url-base=${RESET_URL_BASE:http://localhost:4200/reset-password}

# ========================
# Alert Email Notifications
# ========================
app.alert.email.enabled=${ALERT_EMAIL_ENABLED:true}
app.alert.email.recipients=${ALERT_EMAIL_RECIPIENTS:}

# Thymeleaf (mail templates only)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true